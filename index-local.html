<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Paradisier Manager - Application Locale</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F3D3A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paradisier">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230F3D3A' width='100' height='100' rx='20'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='60'>🌴</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0F3D3A 0%, #062B29 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-screen .logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .loading-screen h1 {
            color: #F2C766;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .loading-screen p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .offline-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #0F3D3A;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }
        .offline-badge.show { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="logo">🌴</div>
        <h1>Le Paradisier Manager</h1>
        <p>Chargement de l'application...</p>
    </div>
    
    <!-- Offline Badge -->
    <div class="offline-badge" id="offlineBadge">
        <i class="fas fa-wifi-slash"></i> Mode hors-ligne
    </div>
    
    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app-local.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/modules-extra.js"></script>
    <script src="js/backup-settings.js"></script>
    
    <script>
        // Masquer le loading screen après chargement
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
            }, 500);
        });
        
        // Détecter le mode hors-ligne
        function updateOnlineStatus() {
            const badge = document.getElementById('offlineBadge');
            if (!navigator.onLine) {
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
        
        // Enregistrer le Service Worker pour PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker enregistré'))
                .catch(err => console.log('Service Worker non enregistré:', err));
        }
    </script>
</body>
</html>
