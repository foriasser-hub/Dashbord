name: Build Electron App

on:
  push:
    branches: [main]
    paths:
      - 'electron-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'electron-app/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json
      
      - name: Generate PNG icon using Node.js
        working-directory: ./electron-app
        run: |
          npm install --no-save sharp
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const svg = fs.readFileSync('build/icon.svg');
            sharp(svg).resize(256, 256).png().toFile('build/icon.png').then(() => console.log('Icon generated'));
          "
          
      - name: Install dependencies
        working-directory: ./electron-app
        run: npm ci || npm install
        
      - name: Build Windows installer
        working-directory: ./electron-app
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Le-Paradisier-Manager-Windows-Setup
          path: electron-app/dist/*.exe
          retention-days: 30
          
      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: Le-Paradisier-Manager-Windows-Portable
          path: electron-app/dist/win-unpacked/
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json
      
      - name: Generate PNG icon
        working-directory: ./electron-app
        run: |
          npm install --no-save sharp
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const svg = fs.readFileSync('build/icon.svg');
            sharp(svg).resize(512, 512).png().toFile('build/icon.png').then(() => console.log('Icon generated'));
          "
          
      - name: Install dependencies
        working-directory: ./electron-app
        run: npm ci || npm install
        
      - name: Build Linux AppImage
        working-directory: ./electron-app
        run: npm run dist:linux
        
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Le-Paradisier-Manager-Linux-AppImage
          path: electron-app/dist/*.AppImage
          retention-days: 30
