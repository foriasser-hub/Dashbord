<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:;">
    <title>Le Paradisier Manager</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0F3D3A 0%, #062B29 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-screen .logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .loading-screen h1 {
            color: #F2C766;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .loading-screen p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        .loading-screen .version {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-top: 20px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Electron-specific styles */
        .electron-app .sidebar-header {
            -webkit-app-region: drag;
        }
        .electron-app .sidebar-header button,
        .electron-app .sidebar-header a {
            -webkit-app-region: no-drag;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="logo">🌴</div>
        <h1>Le Paradisier Manager</h1>
        <p>Chargement de l'application...</p>
        <div class="version">Version 2.0.0 - Application Desktop</div>
    </div>
    
    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app-local.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/modules-extra.js"></script>
    <script src="js/backup-settings.js"></script>
    
    <script>
        // Masquer le loading screen après chargement
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 300);
                }
            }, 500);
        });
        
        // Exposer les fonctions pour le menu Electron
        window.exportAllData = function() {
            if (typeof exportData === 'function') {
                exportData();
            }
        };
        
        window.navigateTo = function(module) {
            if (typeof showModule === 'function') {
                showModule(module);
            }
        };
        
        // Informations Electron
        if (window.electronAPI) {
            console.log('Application Electron détectée:', window.electronAPI.getAppInfo());
        }
    </script>
</body>
</html>
