<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F3D3A"/>
      <stop offset="100%" style="stop-color:#062B29"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2C766"/>
      <stop offset="100%" style="stop-color:#D4A84B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  
  <!-- Palm tree trunk -->
  <path d="M128 220 L128 130 Q125 110 130 100" stroke="url(#gold)" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Palm leaves -->
  <path d="M128 100 Q90 70 50 80" stroke="#2D8B7A" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M128 100 Q100 50 60 45" stroke="#2D8B7A" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M128 100 Q128 40 128 30" stroke="#2D8B7A" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M128 100 Q156 50 196 45" stroke="#2D8B7A" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M128 100 Q166 70 206 80" stroke="#2D8B7A" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Coconuts -->
  <circle cx="120" cy="105" r="8" fill="url(#gold)"/>
  <circle cx="136" cy="108" r="7" fill="url(#gold)"/>
  
  <!-- Text "P" for Paradisier -->
  <text x="128" y="195" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#gold)" text-anchor="middle">P</text>
</svg>
